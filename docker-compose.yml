# Local development stack for RentSafe MY.
# `docker compose up -d db redis` is enough to start coding;
# bring up the app services once their Dockerfiles are filled in.
version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-rentsafe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # auto-run schema on first boot
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    depends_on: [db, redis]
    env_file: ./backend/.env
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    # comment out for pure-local dev without containerising the API
    profiles: ["full"]

  nlp:
    build: ./nlp-service
    depends_on: [redis]
    env_file: ./nlp-service/.env
    ports:
      - "${NLP_PORT:-8000}:8000"
    profiles: ["full"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    env_file: ./frontend/.env
    environment:
      # where vite.config.js sends /api calls; inside Docker that is the
      # backend container, not localhost
      BACKEND_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    profiles: ["full"]

volumes:
  postgres-data:
  redis-data:
